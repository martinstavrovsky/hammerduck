<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#000;overflow:hidden}body{display:flex;align-items:center;justify-content:center}body.touch{align-items:flex-start}</style></head><body>
<canvas id="c"></canvas><canvas id="tc" style="position:fixed;left:0;top:0;pointer-events:none"></canvas><div id="safe"></div>
<script>window.onerror=(m,src,l)=>{document.title='ERR '+m+' @'+String(src).split('/').pop()+':'+l;};</script>
<script src="../src/engine.js"></script>
<script src="../worlds/island.js"></script>
<script src="../worlds/frost.js"></script>
<script src="../src/story.js"></script>
<script src="../src/touch.js"></script>
<script>
// Screenshot staging page: freezes any game moment for headless Chrome screenshots (see CLAUDE.md).
// staging: #w=2&x=60&t=1.5  (play at column x for t seconds, then freeze)
//          #intro=2&t=7      (world 2 intro at time t) · #story&t=6 · #win=2&t=3 (&all=1: all 100 collected) · #title&t=1
//          &touch=1 (touch controls; &pause=1 pauses) · #w=2&x=196&boss=hover|stuck&bx=200&t=1 (boss state) · &right=1 (hold →) · &slide=1 (then ↓) · &crouch=1
const q = Object.fromEntries(location.hash.slice(1).split('&').map(p => p.split('=')));
if ('touch' in q) touchMode = true; // &touch=1: show the touch controls
const t = +(q.t || 0.5), steps = Math.round(t / STEP_DT);
WORLD = WORLDS[(+(q.w || q.intro || q.win || 1)) - 1]; resetGame();
if ('title' in q) { state = 'title'; titleT = t; }
else if (q.intro) { state = 'intro'; introT = 0; while (introT < t) { WORLD.intro.update(1/60); updateFx(1/60); gT += 1/60; } shake = 0; }
else if ('story' in q) { WORLD = WORLDS[0]; resetGame(); state = 'win'; boss.dead = true; P.x = WORLD.winStopX - 16; P.y = groundTop(Math.floor(P.x/TS)) - P.h; camX = WORLD.winCamX; state = 'story'; storyT = 0; while (storyT < t) { STORY.update(1/60); updateFx(1/60); gT += 1/60; } shake = 0; }
else if (q.win) { boss.dead = true; boss.active = false; for (let y = 0; y < ROWS; y++) { if (T(WORLD.arena.L, y) === 6) setT(WORLD.arena.L, y, 0); if (T(WORLD.arena.R, y) === 6) setT(WORLD.arena.R, y, 0); }
  if (q.all) stats.seeds = L.totalSeeds; stats.bugs = 23; playTime = 400;
  state = 'play'; P.x = (WORLD.goalCol - 1) * TS; P.y = groundTop(WORLD.goalCol) - P.h; keys.ArrowRight = true; for (let i = 0; i < steps + 240; i++) step(STEP_DT); keys.ArrowRight = false; shake = 0; }
else { state = 'play'; const col = +(q.x || 2); P.x = col * TS; P.y = groundTop(col) - P.h; camX = clamp(P.x - W * 0.4, 0, LW * TS - W);
  if (q.crouch) keys.ArrowDown = true; if (q.right) keys.ArrowRight = true;
  if (q.boss) { boss.active = true; boss.awake = true; boss.state = q.boss; boss.st_t = 0.3; boss.x = (+(q.bx || 200)) * TS; boss.y = q.boss === 'stuck' ? groundTop(200) - boss.h : groundTop(200) - 270; boss.tx = boss.x; boss.ty = groundTop(200) - boss.h; for (let y = 0; y < ROWS - 2; y++) setT(WORLD.arena.L, y, 6); P.inv = 99; }
  for (let i = 0; i < steps; i++) { if (q.slide && i === steps - 20) { keys.ArrowRight = false; keys.ArrowDown = true; } step(STEP_DT); if (q.boss) { P.inv = 99; if (q.boss === 'stuck') { boss.state = 'stuck'; boss.st_t = 0.5; } } }
  shake = 0; if (q.nohud) state = 'intro-nohud'; if (q.pause) state = 'pause'; }
gT += 0.001; const redraw = () => { render(); drawTouch(); requestAnimationFrame(redraw); }; requestAnimationFrame(redraw); render(); document.title = 'OK ' + state + ' ' + cv.width + 'x' + cv.height + ' px=' + ctx.getImageData(500,300,1,1).data.join(',');
</script></body></html>

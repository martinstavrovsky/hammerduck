<body>
<canvas id="c"></canvas>
<script>
'use strict';
// =====================================================================
//  HAMMER DUCK — Bug Island Rescue
//  Single-file canvas platformer. No external assets.
// =====================================================================
const W = 1024, H = 576, TS = 48, ROWS = 12;
const G = 2300, JUMPV = 880, MAXV = 320, MAXFALL = 950, STEP_DT = 1 / 120;
const FONT = '"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif';
const OUT = '#3b2410';

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let scale = 1, dpr = 1;
function resize() {
  dpr = window.devicePixelRatio || 1;
  scale = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = (W * scale) + 'px'; cv.style.height = (H * scale) + 'px';
  cv.width = Math.round(W * scale * dpr); cv.height = Math.round(H * scale * dpr);
}
addEventListener('resize', resize); resize();

if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    r = Math.min(typeof r === 'number' ? r : (r && r[0]) || 0, w / 2, h / 2);
    this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r); this.closePath();
  };
}

// ---------------------------------------------------------------- utils
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - (1 - t) * (1 - t);
const easeInOut = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const rand = (a, b) => a + Math.random() * (b - a);
const aabb = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------------------------------------------------------------- input
const keys = {};
let jumpBuf = 0, atkBuf = 0, downBuf = 0, throwBuf = 0;
// keyboard: SPACE jump · H hammer · J slam · G throw · ↓ slam (air) / crouch (ground)
const JUMP_KEYS = ['Space', 'ArrowUp', 'KeyW'];
const ATK_KEYS = ['KeyH', 'KeyX'];
const SLAM_KEYS = ['KeyJ', 'ArrowDown', 'KeyS'];
const THROW_KEYS = ['KeyG'];
let pad = {}, padPrev = {};
addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  initAudio();
  if (e.repeat) return;
  keys[e.code] = true;
  if (JUMP_KEYS.includes(e.code)) jumpBuf = 0.13;
  if (SLAM_KEYS.includes(e.code)) downBuf = 0.1;
  if (ATK_KEYS.includes(e.code)) atkBuf = 0.12;
  if (THROW_KEYS.includes(e.code)) throwBuf = 0.12;
  onPress(e.code);
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (state === 'play') state = 'pause'; });
addEventListener('pointerdown', () => initAudio());

function pollPad() {
  padPrev = pad; pad = {};
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  let p = null; for (const x of pads || []) if (x) { p = x; break; }
  if (!p) return;
  const b = i => !!(p.buttons[i] && p.buttons[i].pressed);
  const ax = p.axes[0] || 0, ay = p.axes[1] || 0;
  pad = { left: ax < -0.4 || b(14), right: ax > 0.4 || b(15), down: ay > 0.5 || b(13), jump: b(0), atk: b(1), throw: b(2), slam: b(3), start: b(9) };
  if (pad.jump && !padPrev.jump) { jumpBuf = 0.13; initAudio(); onPress('Space'); }
  if (pad.atk && !padPrev.atk) atkBuf = 0.12;
  if (pad.throw && !padPrev.throw) throwBuf = 0.12;
  if ((pad.down && !padPrev.down) || (pad.slam && !padPrev.slam)) downBuf = 0.1;
  if (pad.start && !padPrev.start) onPress('Enter');
}
function input() {
  return {
    left: keys.ArrowLeft || keys.KeyA || pad.left,
    right: keys.ArrowRight || keys.KeyD || pad.right,
    down: keys.ArrowDown || keys.KeyS || pad.down,
    jump: keys.Space || keys.ArrowUp || keys.KeyW || pad.jump,
  };
}

// ---------------------------------------------------------------- audio
let actx = null, master = null, musicGain = null, nbuf = null, muted = false;
function initAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  master = actx.createGain(); master.gain.value = 0.55; master.connect(actx.destination);
  musicGain = actx.createGain(); musicGain.gain.value = 0.5; musicGain.connect(master);
  nbuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
  const d = nbuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
function tone(freq, dur, type = 'square', vol = 0.15, slide = 0, when = 0, dest, attack = 0) {
  if (!actx || muted) return;
  const t = when || actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), t + dur);
  if (attack) { g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + attack); }
  else g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(dest || master); o.start(t); o.stop(t + dur + 0.03);
}
function noise(dur, vol = 0.3, freq = 1200, when = 0, dest) {
  if (!actx || muted) return;
  const t = when || actx.currentTime;
  const s = actx.createBufferSource(); s.buffer = nbuf;
  const f = actx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 0.8;
  const g = actx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f); f.connect(g); g.connect(dest || master); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.03);
}
const midi = m => 440 * Math.pow(2, (m - 69) / 12);
const SFX = {
  jump: () => tone(330, 0.16, 'square', 0.09, 2.4),
  swing: () => noise(0.14, 0.22, 2600),
  smash: () => { tone(180, 0.22, 'square', 0.2, 0.35); noise(0.2, 0.4, 700); tone(880, 0.1, 'triangle', 0.14, 1.6, actx && actx.currentTime + 0.05); },
  thud: () => { tone(120, 0.12, 'triangle', 0.18, 0.5); noise(0.08, 0.15, 500); },
  seed: () => { tone(988, 0.06, 'square', 0.08); tone(1319, 0.16, 'square', 0.08, 1, actx && actx.currentTime + 0.06); },
  heart: () => { [660, 880, 1100].forEach((f, i) => tone(f, 0.12, 'triangle', 0.15, 1, actx && actx.currentTime + i * 0.07)); },
  hurt: () => { tone(420, 0.3, 'sawtooth', 0.14, 0.35); },
  crate: () => { noise(0.18, 0.35, 1400); tone(220, 0.1, 'triangle', 0.18, 0.5); },
  spring: () => tone(180, 0.35, 'triangle', 0.22, 4.5),
  slam: () => { tone(90, 0.4, 'sawtooth', 0.22, 0.3); noise(0.35, 0.5, 400); },
  checkpoint: () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.16, 'square', 0.08, 1, actx && actx.currentTime + i * 0.08)); },
  die: () => { [600, 500, 400, 300, 200].forEach((f, i) => tone(f, 0.16, 'square', 0.1, 0.9, actx && actx.currentTime + i * 0.12)); },
  roar: () => { tone(110, 0.8, 'sawtooth', 0.25, 0.5); noise(0.7, 0.3, 300); },
  bossHit: () => { tone(140, 0.3, 'square', 0.22, 0.5); noise(0.25, 0.4, 900); },
  splash: () => { noise(0.4, 0.35, 900); },
  laugh: () => {
    if (!actx) return; const t = actx.currentTime;
    [392, 370, 349, 330].forEach((f, i) => {
      const w = t + i * 0.21;
      noise(0.05, 0.035, 1600, w);
      tone(f, 0.17, 'triangle', 0.13, 0.9, w + 0.02, null, 0.03);
      tone(f * 2, 0.14, 'sine', 0.03, 0.9, w + 0.02, null, 0.03);
    });
  },
  ready: () => { if (!actx) return; const t = actx.currentTime; [660, 990, 1320].forEach((f, i) => tone(f, 0.12, 'triangle', 0.09, 1, t + i * 0.06)); },
  denied: () => tone(160, 0.08, 'square', 0.05, 0.8),
  throwIt: () => { noise(0.18, 0.3, 2400); tone(500, 0.18, 'triangle', 0.12, 1.8); },
  catchIt: () => { tone(880, 0.06, 'square', 0.08); tone(1320, 0.12, 'triangle', 0.1, 1, actx && actx.currentTime + 0.05); noise(0.05, 0.15, 1200); },
  win: () => {
    if (!actx) return; const t = actx.currentTime;
    const seq = [[72, 0], [76, .14], [79, .28], [84, .42], [79, .62], [84, .76]];
    seq.forEach(([m, d]) => tone(midi(m), 0.22, 'square', 0.12, 1, t + d));
    [72, 76, 79, 84].forEach(m => tone(midi(m), 1.4, 'triangle', 0.1, 1, t + 0.95));
  },
};
// background music: cheerful island loop, dramatic boss theme, calm family theme
const MEL = [72, 0, 76, 79, 0, 76, 79, 81, 81, 0, 77, 0, 72, 0, 77, 81, 79, 0, 74, 0, 71, 74, 79, 0, 76, 77, 76, 74, 72, 0, 0, 0,
  76, 0, 72, 0, 69, 72, 76, 0, 77, 0, 81, 0, 84, 0, 81, 77, 79, 0, 77, 0, 76, 0, 74, 0, 72, 0, 79, 0, 72, 0, 0, 0];
const ROOTS = [48, 41, 43, 48, 45, 41, 43, 48];
// Boss: A minor, driving octave bass, kick + snare backbeat
const BOSS_MEL = [69, 0, 72, 0, 76, 0, 75, 76, 77, 0, 76, 0, 72, 0, 69, 0, 72, 0, 77, 0, 81, 0, 80, 81, 79, 0, 77, 0, 74, 0, 71, 0,
  81, 0, 81, 79, 77, 0, 76, 0, 77, 76, 74, 0, 72, 0, 71, 0, 69, 0, 72, 0, 77, 0, 76, 74, 76, 0, 68, 0, 71, 0, 74, 0];
const BOSS_ROOTS = [45, 45, 41, 43, 45, 45, 41, 40];
// Calm: F major lullaby — [start step, note, length in steps]
const CALM_MEL = [[0, 72, 4], [4, 77, 4], [8, 76, 6], [14, 72, 2], [16, 74, 4], [20, 77, 2], [22, 74, 2], [24, 72, 8],
  [32, 69, 2], [34, 72, 2], [36, 77, 4], [40, 81, 4], [44, 79, 2], [46, 77, 2], [48, 74, 4], [52, 79, 4], [56, 77, 8]];
const CALM_CHORDS = [[53, 0], [57, 1], [58, 0], [60, 0], [53, 0], [50, 1], [58, 0], [60, 0]]; // root, minor?
// Hero: triumphant G-major march after beating the boss
const HERO_MEL = [67, 0, 71, 74, 79, 0, 78, 79, 76, 0, 72, 0, 76, 79, 84, 0, 81, 0, 78, 0, 74, 0, 78, 81, 79, 0, 0, 0, 74, 76, 78, 79,
  76, 0, 79, 0, 83, 0, 81, 79, 76, 0, 72, 76, 79, 0, 76, 0, 74, 0, 78, 81, 86, 0, 84, 81, 78, 0, 74, 0, 81, 0, 0, 0];
const HERO_ROOTS = [43, 48, 50, 43, 40, 48, 50, 50];
const TRACKS = {
  hero: { bpm: 126, play(s, t, b) {
    const i = s % 64, bar = Math.floor(i / 8), pos = i % 8, r = HERO_ROOTS[bar];
    if (HERO_MEL[i]) { tone(midi(HERO_MEL[i]), b * 0.95, 'square', 0.045, 0, t, musicGain); tone(midi(HERO_MEL[i] + 12), b * 0.8, 'triangle', 0.02, 0, t, musicGain); }
    if (pos % 2 === 0) tone(midi(pos % 4 === 0 ? r : r + 7), b * 1.6, 'triangle', 0.17, 0, t, musicGain);
    if (pos === 0 || pos === 4) tone(140, 0.12, 'sine', 0.3, 0.35, t, musicGain);
    if (pos === 2 || pos === 6) noise(0.1, 0.18, 1900, t, musicGain);
    if (pos === 7) { noise(0.05, 0.08, 1900, t, musicGain); noise(0.05, 0.08, 1900, t + b / 2, musicGain); }
    if (pos % 2 === 1) noise(0.03, 0.04, 8000, t, musicGain);
  } },
  main: { bpm: 138, play(s, t, b) {
    const m = MEL[s % 64], bar = Math.floor(s % 64 / 8), pos = s % 8, r = ROOTS[bar];
    if (m) tone(midi(m), b * 0.9, 'square', 0.045, 0, t, musicGain);
    const bn = (pos === 0 || pos === 4) ? r : (pos === 2 || pos === 6) ? r + 7 : 0;
    if (bn) tone(midi(bn), b * 1.5, 'triangle', 0.16, 0, t, musicGain);
    if (pos % 2 === 1) noise(0.04, 0.05, 7000, t, musicGain);
    if (pos === 0 || pos === 4) noise(0.08, 0.1, 150, t, musicGain);
  } },
  boss: { bpm: 168, play(s, t, b) {
    const i = s % 64, bar = Math.floor(i / 8), pos = i % 8, r = BOSS_ROOTS[bar];
    tone(midi(r + (pos % 2 ? 12 : 0)), b * 0.85, 'sawtooth', 0.07, 0, t, musicGain);
    if (BOSS_MEL[i]) tone(midi(BOSS_MEL[i]), b * 0.95, 'square', 0.05, 0, t, musicGain);
    if (pos === 0 || pos === 4 || (bar % 2 === 1 && pos === 7)) tone(150, 0.14, 'sine', 0.45, 0.3, t, musicGain);   // kick
    if (pos === 2 || pos === 6) { noise(0.13, 0.32, 1800, t, musicGain); tone(220, 0.08, 'triangle', 0.1, 0.5, t, musicGain); } // snare
    noise(0.03, pos % 2 ? 0.06 : 0.03, 8000, t, musicGain);                                                          // hats
    if (pos === 0 && bar % 4 === 0) { tone(midi(r + 12), b * 7, 'sawtooth', 0.025, 0, t, musicGain, 0.1); tone(midi(r + 15), b * 7, 'sawtooth', 0.02, 0, t, musicGain, 0.1); } // dark stab
    if (bar === 7 && pos >= 4) tone(midi(52 - (pos - 4) * 2), b * 0.9, 'triangle', 0.18, 0.7, t, musicGain);   // tom fill
  } },
  calm: { bpm: 72, play(s, t, b) {
    const i = s % 64, bar = Math.floor(i / 8), pos = i % 8, [r, minor] = CALM_CHORDS[bar], third = minor ? 3 : 4;
    const arp = [0, 7, 12, 12 + third, 19, 12 + third, 12, 7];
    tone(midi(r + arp[pos]), b * 1.8, 'triangle', 0.05, 0, t, musicGain, 0.02);
    if (pos === 0) tone(midi(r - 12), b * 8, 'sine', 0.12, 0, t, musicGain, 0.15);
    for (const [st, n, len] of CALM_MEL) if (st === i) { tone(midi(n), b * len * 1.05, 'sine', 0.09, 0, t, musicGain, 0.08); tone(midi(n + 12), b * len, 'sine', 0.015, 0, t, musicGain, 0.1); }
  } },
};
let nextNote = 0, stepIdx = 0, curTrack = null;
function currentTrack() {
  if (state === 'play' && boss && boss.dead) return 'hero';
  if (state === 'title' || state === 'play') return (boss && boss.active && !boss.dead) ? 'boss' : 'main';
  if (state === 'win' && winT > 2.6) return 'calm';
  return null;
}
function music() {
  if (!actx || muted) { curTrack = null; return; }
  const tr = currentTrack();
  if (!tr) { curTrack = null; return; }
  if (tr !== curTrack) { curTrack = tr; stepIdx = 0; nextNote = actx.currentTime + 0.08; }
  if (nextNote < actx.currentTime - 0.3) nextNote = actx.currentTime + 0.05;
  const T = TRACKS[tr], b = 60 / T.bpm / 2;
  while (nextNote < actx.currentTime + 0.25) { T.play(stepIdx, nextNote, b); nextNote += b; stepIdx++; }
}

// ---------------------------------------------------------------- level
let LW = 262, tiles, L, P, boss;
let state = 'title', camX = 0, camY = 0, shake = 0, freeze = 0, gT = 0, titleT = 0, winT = 0, playTime = 0;
const stats = { bugs: 0, seeds: 0 };
const T = (x, y) => (x < 0 || x >= LW) ? 4 : (y < 0 || y >= ROWS) ? 0 : tiles[y * LW + x];
const setT = (x, y, v) => { if (x >= 0 && x < LW && y >= 0 && y < ROWS) tiles[y * LW + x] = v; };
const SOLID = t => t === 1 || t === 3 || t === 4 || t === 6;
function groundTop(col) { for (let y = 0; y < ROWS; y++) { const t = T(col, y); if (SOLID(t) || t === 2) return y * TS; } return ROWS * TS; }

const EDEF = {
  beetle: { w: 40, h: 30, speed: 55, hp: 1 },
  ladybug: { w: 38, h: 28, speed: 100, hp: 1 },
  armor: { w: 46, h: 34, speed: 42, hp: 2 },
  fly: { w: 36, h: 30, hp: 1, fly: true },
  boss: { w: 120, h: 88, speed: 100, hp: 5 },
};
const STAND_H = 48, CROUCH_H = 30;
const START_LIVES = 3, MAX_LIVES = 9;
let goT = 0, sunJoy = 0, laughT = 0;
const allSeeds = () => stats.seeds >= L.totalSeeds;
const ARENA_L = 201, ARENA_R = 227, GOAL_COL = 238;

function buildLevel() {
  tiles = new Uint8Array(LW * ROWS);
  L = { enemies: [], items: [], springs: [], cps: [], movers: [], signs: [], decor: [], crateLoot: {}, totalSeeds: 0, totalBugs: 0, family: null };
  const ground = (a, b, h) => { for (let x = a; x <= b; x++) for (let y = ROWS - h; y < ROWS; y++) setT(x, y, 1); };
  const plat = (x, y, w) => { for (let i = 0; i < w; i++) setT(x + i, y, 2); };
  const block = (x, y, w, h) => { for (let i = 0; i < w; i++) for (let j = 0; j < h; j++) setT(x + i, y + j, 4); };
  const crate = (x, y, loot = 'seeds') => { setT(x, y, 3); L.crateLoot[x + ',' + y] = loot; if (loot === 'seeds') L.totalSeeds += 3; };

  // ---- terrain
  ground(0, 29, 2);                       // 1: starting beach
  plat(23, 7, 3);
  crate(20, 9);
  ground(33, 58, 2); ground(40, 46, 3);   // 2: first hills
  plat(48, 6, 4);
  crate(52, 9); crate(53, 9); crate(52, 8, 'heart');
  plat(60, 8, 2);                         // log over water
  ground(63, 70, 3); ground(71, 78, 5); ground(79, 90, 3); // 3: big hill
  block(84, 6, 2, 1);
  block(100, 8, 2, 4);                    // 4: lagoon with rafts
  ground(111, 140, 2);                    // 5: crate fields
  for (let i = 0; i < 3; i++) { crate(124 + i, 9, i === 1 ? 'heart' : 'seeds'); crate(124 + i, 8, i === 1 ? 'seeds' : 'none'); }
  plat(129, 7, 3);
  ground(144, 170, 2);                    // 6: towers & springs
  block(148, 7, 2, 3); plat(151, 5, 2); block(154, 4, 2, 6); block(158, 8, 2, 2);
  plat(162, 6, 3);
  ground(173, 200, 2);                    // 7: bug swarm
  crate(186, 9, 'heart');
  plat(190, 7, 4);
  ground(201, LW - 1, 2);                 // 8+9: arena and home beach
  crate(205, 9, 'heart');
  for (let y = 0; y < ROWS - 2; y++) setT(ARENA_R, y, 6); // bug-goo gate

  // ---- entities
  const seeds = (x, y, n = 1) => { for (let i = 0; i < n; i++) { L.items.push({ kind: 'seed', x: (x + i) * TS + TS / 2, y: y * TS + TS / 2, t: Math.random() * 6 }); L.totalSeeds++; } };
  const seedsV = (x, y, n) => { for (let i = 0; i < n; i++) { L.items.push({ kind: 'seed', x: x * TS + TS, y: (y + i) * TS + TS / 2, t: Math.random() * 6 }); L.totalSeeds++; } };
  const seedArc = (x, y, n) => { for (let i = 0; i < n; i++) { L.items.push({ kind: 'seed', x: (x + i) * TS + TS / 2, y: y * TS + TS / 2 - Math.sin(Math.PI * i / (n - 1)) * 60, t: Math.random() * 6 }); L.totalSeeds++; } };
  const bug = (type, x, row) => {
    const d = EDEF[type];
    const e = { type, w: d.w, h: d.h, hp: d.hp, vx: 0, vy: 0, dir: -1, t: Math.random() * 5, dead: false, deadT: 0, inv: 0, kb: 0, awake: false };
    e.x = x * TS + TS / 2 - d.w / 2;
    if (d.fly) { e.y = row * TS; e.ox = e.hx = e.x; e.oy = e.hy = e.y; e.st = 'hover'; e.cd = 1.2; e.side = 0; }
    else e.y = (row !== undefined ? row * TS : groundTop(x)) - d.h;
    L.enemies.push(e); if (type !== 'boss') L.totalBugs++;
    return e;
  };
  const spring = (x, row) => L.springs.push({ x: x * TS, y: row * TS, w: TS, h: TS, comp: 0 });
  const cp = x => L.cps.push({ x: x * TS + TS / 2, y: groundTop(x), active: false, raise: 0 });
  const sign = (x, text) => L.signs.push({ x: x * TS + TS / 2, y: groundTop(x), text });
  const mover = (x1, y1, x2, y2, w, period) => L.movers.push({ x: x1 * TS, y: y1 * TS, ax: x1 * TS, ay: y1 * TS, bx: x2 * TS, by: y2 * TS, w: w * TS, h: 20, period, t: 0, dx: 0, dy: 0 });

  // 1
  sign(3, '← →  walk'); sign(8, 'SPACE  jump'); sign(13, 'H  hammer   ·   G  THROW it!');

  for (let i = 0; i < 2; i++) addPart({ type: 'ring', x: cx, y: by - 4, life: 0.35, size: 20 + i * 10, vx: 0, vy: 0 });
  const r = { x: P.x - 56, y: P.y + P.h - 52, w: P.w + 112, h: 58 };
  for (const e of L.enemies) if (!e.dead && e.awake !== false && aabb(r, e)) hitEnemy(e, Math.sign(e.x + e.w / 2 - cx) || 1);
  breakCratesIn(r);
}

function hurtPlayer(srcX) {
  if (P.inv > 0 || P.dead || state !== 'play') return;
  P.hearts--; P.inv = 1.4; P.hurtT = 0.3; P.pound = false; P.swinging = false;
  P.vx = (P.x + P.w / 2 < srcX ? -1 : 1) * 380; P.vy = -480; shake = Math.max(shake, 10); SFX.hurt();
  popup(P.x + P.w / 2, P.y - 10, 'OUCH!', '#ff6b8b', 26, false);
  if (P.hearts <= 0) { P.dead = true; P.deadT = 0; P.vy = -760; P.rot = 0; P.lives--; SFX.die(); }
}
function respawn() {
  const s = P.spawn;
  P.h = STAND_H; P.crouch = false;
  Object.assign(P, { x: s.x - P.w / 2, y: s.y - P.h, vx: 0, vy: 0, dead: false, hearts: 3, inv: 1.5, rot: 0, pound: false, swinging: false, splashed: false, riding: null, hurtT: 0, face: 1, hasHammer: true, throwCD: 0 });
  thrown = null;
  if (boss && !boss.dead && boss.active) {
    boss.active = false; boss.awake = false; boss.state = 'sleep'; boss.hp = EDEF.boss.hp; boss.inv = 0; boss.kb = 0; boss.t = 0; boss.x = boss.sx; boss.y = boss.sy; boss.vx = 0; boss.vy = 0; boss.dir = -1;
    for (let y = 0; y < ROWS - 2; y++) if (T(ARENA_L, y) === 6) setT(ARENA_L, y, 0);
  }

  L.enemies = L.spawns.map(e => ({ ...e }));
  if (boss) L.enemies.push(boss);
  camX = clamp(P.x - W * 0.4, 0, LW * TS - W);
}

function breakCrate(tx, ty) {
  setT(tx, ty, 0);
  const cx = tx * TS + TS / 2, cy = ty * TS + TS / 2;
  chips(cx, cy); SFX.crate();
  const loot = L.crateLoot[tx + ',' + ty];
  if (loot === 'seeds') for (let i = 0; i < 3; i++) L.items.push({ kind: 'seed', x: cx, y: cy, vx: (i - 1) * 140 + rand(-30, 30), vy: rand(-620, -420), phys: true, age: 0, t: 0 });
  if (loot === 'heart') L.items.push({ kind: 'heart', x: cx, y: cy, vx: 0, vy: -520, phys: true, age: 0, t: 0 });
}
function breakCratesIn(r) {
  let n = 0;
  for (let tx = Math.floor(r.x / TS); tx <= Math.floor((r.x + r.w) / TS); tx++)
    for (let ty = Math.floor(r.y / TS); ty <= Math.floor((r.y + r.h) / TS); ty++)
      if (T(tx, ty) === 3) { breakCrate(tx, ty); n++; }
  return n;
}

function hitEnemy(e, dir) {
  if (e.dead || e.inv > 0) return false;
  const cx = e.x + e.w / 2, cy = e.y + e.h / 2;
  e.hp--;
  if (e.type === 'boss') {
    if (!e.active) return false;
    burstStars(cx, cy, 10); shake = 16; freeze = 0.08;
    if (e.hp <= 0) { killBoss(e); return true; }
    e.inv = 1.0; e.kb = 0.35; e.vx = dir * 380; e.vy = -350; e.state = 'walk'; e.t = 0; SFX.bossHit();
    popup(cx, e.y - 10, ['BONK!', 'OOF!', 'WHACK!', 'CRUNCH!'][e.hp % 4], '#ffe14d', 40);
    return true;
  }
  if (e.hp <= 0) {
    e.dead = true; e.deadT = 0; stats.bugs++;
    if (e.type === 'fly') { e.vy = -250; }
    SFX.smash(); burstStars(cx, cy, 8);
    popup(cx, e.y - 16, SMASH_WORDS[Math.floor(Math.random() * SMASH_WORDS.length)]);
  } else {
    e.inv = 0.35; e.kb = 0.3; e.vx = dir * 300; e.vy = -300; e.cracked = true; SFX.bossHit();
    popup(cx, e.y - 16, 'CRACK!', '#9fe7ff', 26);
    burstStars(cx, cy, 4, 0.6);
  }
  return true;
}
function killBoss(e) {
  e.dead = true; e.deadT = 0; e.active = false;
  SFX.smash(); SFX.roar();
  setTimeout(() => SFX.checkpoint(), 500);
  const cx = e.x + e.w / 2, cy = e.y + e.h / 2;
  burstStars(cx, cy, 24, 1.6); confetti(cx, cy, 40);
  popup(cx, e.y - 30, 'BIG BUG BEATEN!', '#ffe14d', 46);
  for (let x of [ARENA_L, ARENA_R]) for (let y = 0; y < ROWS; y++) if (T(x, y) === 6) {
    setT(x, y, 0);
    for (let i = 0; i < 3; i++) addPart({ type: 'goo', x: x * TS + rand(0, TS), y: y * TS + rand(0, TS), vx: rand(-120, 120), vy: rand(-300, 0), g: 900, life: rand(.5, 1), size: rand(6, 12), color: '#b25cff' });
  }
  for (let i = 0; i < 6; i++) L.items.push({ kind: 'seed', x: cx, y: cy, vx: rand(-300, 300), vy: rand(-700, -400), phys: true, age: 0, t: 0 });
  L.items.push({ kind: 'heart', x: cx, y: cy, vx: 0, vy: -650, phys: true, age: 0, t: 0 });
  for (const m of L.enemies) if (m.minion && !m.dead) hitEnemy(m, 1);
}

function updateMovers(dt) {
  for (const m of L.movers) {
    m.t += dt;
    const f = 0.5 - 0.5 * Math.cos(m.t / m.period * Math.PI * 2);
    const nx = lerp(m.ax, m.bx, f), ny = lerp(m.ay, m.by, f);
    m.dx = nx - m.x; m.dy = ny - m.y; m.x = nx; m.y = ny;
  }
}

function updateEnemies(dt) {
  const px = P.x + P.w / 2, py = P.y + P.h / 2;
  for (let i = L.enemies.length - 1; i >= 0; i--) {
    const e = L.enemies[i];
    if (e.dead) {
      e.deadT += dt;
      if (e.type === 'fly') { e.vy += G * dt; e.y += e.vy * dt; }
      if (e.type === 'boss') { e.y += 0; }
      if (e.deadT > 0.8 && e.type !== 'boss') L.enemies.splice(i, 1);
      continue;
    }
    if (e.type === 'boss') { updateBoss(e, dt); continue; }
    if (!e.awake) { if (Math.abs(e.x - P.x) < W * 0.75) e.awake = true; else continue; }
    e.t += dt; e.inv -= dt; e.kb -= dt;
    if (e.type === 'fly') { updateWasp(e, dt); continue; }
    const sp = EDEF[e.type].speed * (e.cracked ? 4.5 : 1);
    if (e.kb <= 0) e.vx = e.dir * sp; else e.vx *= 0.96;
    e.vy = Math.min(e.vy + G * dt, MAXFALL);
    moveBody(e, dt);
    if (e.kb <= 0) {
      if (e.hitL) e.dir = 1; else if (e.hitR) e.dir = -1;
      else if (e.onGround) {
        const fx = e.dir > 0 ? e.x + e.w + 2 : e.x - 2;
        const t = T(Math.floor(fx / TS), Math.floor((e.y + e.h + 4) / TS));
        if (!SOLID(t) && t !== 2) e.dir *= -1;
      }
    }
    if (e.y > ROWS * TS + 100) L.enemies.splice(i, 1);
  }
}

// Wasp: hovers near you in a swingy way, then swoops down to head height.
// The swoop passes just above a crouching duck, so ducking (↓) dodges it.
const WASP_SWOOP_Y = 64;
function updateWasp(e, dt) {
  const pcx = P.x + P.w / 2, gy = P.lastGroundY, ecx = e.x + e.w / 2;
  const inTerritory = !P.dead && Math.abs(pcx - (e.ox + e.w / 2)) < 520;
  e.cd -= dt;
  if (e.st === 'swoop') {
    e.su += dt / e.sd; const u = Math.min(1, e.su);
    e.x = lerp(e.sx0, e.sx1, u);
    e.y = lerp(e.sy0, e.sty, Math.min(1, Math.sin(Math.PI * u) * 1.7));
    e.dir = Math.sign(e.sx1 - e.sx0) || 1;
    if (u >= 1) {
      e.st = 'hover'; e.cd = rand(1.4, 2.6); e.side = Math.sign(e.sx1 - e.sx0) || 1;
      e.hx = e.x - Math.sin(e.t * 1.3) * 35; e.hy = e.y - Math.sin(e.t * 2.6) * 18;
    }
    return;
  }
  e.dir = pcx < ecx ? -1 : 1;
  if (e.st === 'windup') {
    e.wt += dt;
    e.x = e.hx + Math.sin(e.wt * 70) * 3; e.y = e.hy - e.wt * 40;
    if (e.wt > 0.5) {
      let dx = pcx - ecx; if (Math.abs(dx) < 150) dx = (Math.sign(dx) || 1) * 150;
      e.st = 'swoop'; e.su = 0; e.sx0 = e.x; e.sy0 = e.y; e.sx1 = e.x + dx * 2; e.sty = gy - WASP_SWOOP_Y;
      e.sd = clamp(Math.abs(dx * 2) / 400, 0.9, 1.7);
      tone(300, 0.5, 'sawtooth', 0.06, 0.5);
    }
    return;
  }
  // hover: drift toward a spot beside and above the duck
  let tx = e.ox, ty = e.oy;
  if (inTerritory) { if (!e.side) e.side = ecx < pcx ? -1 : 1; tx = pcx + e.side * 190 - e.w / 2; ty = gy - 210; }
  const sp = 170 * dt;
  e.hx += clamp(tx - e.hx, -sp, sp); e.hy += clamp(ty - e.hy, -sp, sp);
  e.x = e.hx + Math.sin(e.t * 1.3) * 35; e.y = e.hy + Math.sin(e.t * 2.6) * 18;
  if (inTerritory && e.cd <= 0 && Math.abs(e.hx - tx) < 70 && Math.abs(e.hy - ty) < 70) {
    e.st = 'windup'; e.wt = 0; e.hx = e.x; e.hy = e.y;
    popup(e.x + e.w / 2, e.y - 14, '!', '#ff4d4d', 30, false);
    tone(520, 0.25, 'square', 0.05, 1.4);
  }
}

function updateBoss(b, dt) {
  b.t += dt; b.inv -= dt; b.kb -= dt;
  if (!b.active) {
    b.zt += dt;
    if (b.zt > 1.3 && Math.abs(b.x - P.x) < W) { b.zt = 0; pops.push({ x: b.x + b.w * 0.75, y: b.y - 10, text: 'z', color: '#ffffff', size: 26, burst: false, t: 0, life: 1.2, drift: 1 }); }
    if (!b.dead && state === 'play' && P.x > (ARENA_L + 4) * TS && !P.dead) {
      b.active = true; b.awake = true; b.state = 'walk'; b.t = 0; b.faceT = 0;
      for (let y = 0; y < ROWS - 2; y++) setT(ARENA_L, y, 6);
      shake = 18; SFX.roar(); popup(b.x + b.w / 2, b.y - 30, 'BIG BUG WAKES UP!', '#ff6b8b', 40);
    }
    b.vy = Math.min(b.vy + G * dt, MAXFALL); b.vx = 0; moveBody(b, dt);
    return;
  }
  const px = P.x + P.w / 2, bx = b.x + b.w / 2, angry = b.hp <= 2;
  b.faceT -= dt;
  if (b.state === 'walk') {
    if (b.faceT <= 0) { b.dir = px < bx ? -1 : 1; b.faceT = angry ? 0.7 : 1.2; }
    if (b.kb <= 0) b.vx = b.dir * (angry ? 320 : 210);
    if (b.t > (angry ? 1.5 : 2.3) && b.onGround && b.kb <= 0) { b.state = 'crouch'; b.t = 0; }
  } else if (b.state === 'crouch') {
    b.vx = 0;
    if (b.t > 0.25) { b.state = 'air'; b.t = 0; b.dir = px < bx ? -1 : 1; b.vy = -1000; b.vx = b.dir * clamp(Math.abs(px - bx) * 1.15, 250, 800); SFX.jump(); }
  } else if (b.state === 'air') {
    if (b.onGround && b.t > 0.1) {
      b.state = 'walk'; b.t = 0; shake = 14; SFX.slam(); dust(bx, b.y + b.h, 16, 2.5);
      const alive = L.enemies.filter(m => m.minion && !m.dead).length;
      if (b.hp <= 3 && alive < 2 && Math.random() < 0.6) {
        const m = { type: 'ladybug', w: 38, h: 28, hp: 1, vx: 0, vy: 0, dir: Math.random() < .5 ? -1 : 1, t: 0, dead: false, deadT: 0, inv: 0, kb: 0, awake: true, minion: true };
        m.x = rand(ARENA_L + 2, ARENA_R - 3) * TS; m.y = -40; L.enemies.push(m); L.totalBugs++;
      }
    }
  }
  if (b.kb > 0) b.vx *= 0.97;
  b.vy = Math.min(b.vy + G * dt, MAXFALL);
  moveBody(b, dt);
  if (b.hitL) b.dir = 1; if (b.hitR) b.dir = -1;
}

function combat() {
  if (P.dead) return;
  // hammer swing
  if (P.swinging && P.swingT >= 0.08 && P.swingT <= 0.21) {
    const r = swingRect(); let hit = 0;
    for (const e of L.enemies) if (!e.dead && e.awake !== false && !P.hitSet.has(e) && aabb(r, e)) { P.hitSet.add(e); if (hitEnemy(e, P.face)) hit++; }
    hit += breakCratesIn(r);
    if (hit) { freeze = Math.max(freeze, 0.06); shake = Math.max(shake, 7); }
  }
  // slam falling through enemies
  if (P.pound && P.vy > 0) {
    const r = { x: P.x - 6, y: P.y + P.h - 14, w: P.w + 12, h: 28 };
    for (const e of L.enemies) if (!e.dead && e.awake !== false && aabb(r, e)) {
      if (hitEnemy(e, Math.sign(e.x + e.w / 2 - P.x - P.w / 2) || 1) && e.type === 'boss') { P.pound = false; P.vy = -700; P.inv = Math.max(P.inv, 0.4); }
    }
  }
  // contact damage
  const pr = { x: P.x + 5, y: P.y + 8, w: P.w - 10, h: P.h - 10 };
  for (const e of L.enemies) {
    if (e.dead || e.awake === false || (e.type === 'boss' && !e.active)) continue;
    const er = { x: e.x + 4, y: e.y + 4, w: e.w - 8, h: e.h - (e.type === 'fly' ? 2 : 6) };
    if (aabb(pr, er)) { hurtPlayer(e.x + e.w / 2); break; }
  }
}

function updateItems(dt) {
  const px = P.x + P.w / 2, py = P.y + P.h / 2;
  for (let i = L.items.length - 1; i >= 0; i--) {
    const it = L.items[i]; it.t += dt;
    if (it.phys) {
      it.age += dt;
      const b = { x: it.x - 9, y: it.y - 9, w: 18, h: 18, vx: it.vx, vy: Math.min(it.vy + G * 0.8 * dt, MAXFALL) };
      moveBody(b, dt);
      if (b.onGround) b.vx *= 0.9;
      it.x = b.x + 9; it.y = b.y + 9; it.vx = b.vx; it.vy = b.vy;
      if (it.y > ROWS * TS + 50) { L.items.splice(i, 1); continue; }
      if (it.age < 0.25) continue;
    }
    if (P.dead) continue;
    if (Math.abs(it.x - px) < 32 && Math.abs(it.y - py) < 38) {
      L.items.splice(i, 1);
      if (it.kind === 'seed') { stats.seeds++; SFX.seed(); for (let k = 0; k < 5; k++) addPart({ type: 'spark', x: it.x, y: it.y, vx: rand(-150, 150), vy: rand(-150, 150), drag: 5, life: .35, size: 4, color: '#fff3a0' }); }
      else if (P.hearts < 3) { P.hearts++; SFX.heart(); popup(it.x, it.y - 20, '+♥', '#ff6b8b', 30, false); }
      else { P.lives = Math.min(MAX_LIVES, P.lives + 1); SFX.checkpoint(); popup(it.x, it.y - 20, '1-UP!', '#7dff6b', 34, true); burstStars(it.x, it.y, 8); }
    }
  }
}

function updateWorldBits(dt) {
  // springs
  for (const s of L.springs) {
    s.comp = Math.max(0, s.comp - dt * 4);
    const top = s.y + 18;
    if (!P.dead && P.vy > 0 && P.x + P.w > s.x + 8 && P.x < s.x + s.w - 8 && P.prevBottom <= top + 10 && P.y + P.h >= top) {
      P.y = top - P.h; P.vy = -1300; P.springBoost = true; P.pound = false; P.onGround = false; s.comp = 1;
      SFX.spring(); squash(0.65, 1.4);
      for (let k = 0; k < 8; k++) addPart({ type: 'spark', x: s.x + TS / 2 + rand(-20, 20), y: top, vx: rand(-120, 120), vy: rand(-300, -100), drag: 3, life: .4, size: 4, color: '#fff' });
    }
  }
  // checkpoints
  for (const c of L.cps) {
    if (c.active) { c.raise = Math.min(1, c.raise + dt * 2); continue; }
    if (!P.dead && P.x + P.w / 2 > c.x - 10) {
      c.active = true; P.spawn = { x: c.x + 30, y: c.y }; SFX.checkpoint();
      burstStars(c.x, c.y - 90, 10); popup(c.x, c.y - 140, 'CHECKPOINT!', '#7dff6b', 30, false);
    }
  }
  // bushes wiggle
  for (const d of L.decor) if (d.type === 'bush') {
    d.b = Math.max(0, d.b - dt * 2.5);
    if (Math.abs(d.x - (P.x + P.w / 2)) < 30 && Math.abs(d.y - (P.y + P.h)) < 20 && Math.abs(P.vx) > 50 && d.b < 0.2) d.b = 1;
  }
  // goal
  if (state === 'play' && !P.dead && P.x > GOAL_COL * TS) { state = 'win'; winT = 0; P.swinging = false; P.pound = false; }
}

function updateCamera(dt) {
  let tx;
  if (state === 'win') tx = 245.5 * TS - W / 2;
  else { P.look = lerp(P.look, P.face * 70, Math.min(1, dt * 2)); tx = P.x + P.w / 2 - W * 0.45 + P.look; }
  let minX = 0, maxX = LW * TS - W;
  if (boss && boss.active && !boss.dead) { minX = ARENA_L * TS; maxX = (ARENA_R + 1) * TS - W; }
  tx = clamp(tx, minX, maxX);
  camX += (tx - camX) * Math.min(1, dt * 7);
  const ty = P.dead ? camY : Math.min(0, P.y - 170);
  camY += (ty - camY) * Math.min(1, dt * 5);
}

function step(dt) {
  gT += dt;
  if (freeze > 0) { freeze -= dt; return; }
  jumpBuf -= dt; atkBuf -= dt; downBuf -= dt; throwBuf -= dt;
  if (state === 'play') playTime += dt;
  if (state === 'win') {
    const before = winT; winT += dt;
    if (before < 0.9 && winT >= 0.9) SFX.win();
    if (allSeeds() && winT > 1.2) {
      if (Math.random() < dt * 1.3) pops.push({ x: camX + 905 + rand(-70, 50), y: camY + 250 + rand(-5, 45), text: Math.random() < 0.5 ? 'HA HA!' : 'HO HO!', color: '#ffb300', size: 22, burst: false, t: 0, life: 1.1, drift: 1 });
    }
    if (winT > 0.9 && Math.floor(winT / 0.7) !== Math.floor(before / 0.7) && winT < 9) confetti(lerp(camX + 150, camX + W - 150, Math.random()), camY + H * 0.55, 26);
    if (winT > 1 && Math.random() < dt * 3) { const k = L.family.kids[Math.floor(Math.random() * 4)]; addPart({ type: 'heart', x: k.x, y: L.family.y - 40, vx: rand(-30, 30), vy: -90, life: 1.4, size: 14, color: '#ff6b8b' }); }
  }
  updateMovers(dt);
  updatePlayer(dt);
  updateThrown(dt);
  updateEnemies(dt);
  combat();
  updateItems(dt);
  updateWorldBits(dt);
  updateFx(dt);
  updateCamera(dt);
  sunJoy += ((state === 'win' && winT > 1 && allSeeds() ? 1 : 0) - sunJoy) * Math.min(1, dt * 2);
  shake = Math.max(0, shake - dt * 40);
}

// =====================================================================
//  RENDERING
// =====================================================================
function ell(x, y, rx, ry, fill, stroke, lw = 3, rot = 0) {
  ctx.beginPath(); ctx.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); }
}
function heartPath(x, y, s) {
  ctx.beginPath(); ctx.moveTo(x, y + s * 0.3);
  ctx.bezierCurveTo(x, y, x - s * 0.5, y, x - s * 0.5, y + s * 0.3);
  ctx.bezierCurveTo(x - s * 0.5, y + s * 0.6, x, y + s * 0.8, x, y + s);
  ctx.bezierCurveTo(x, y + s * 0.8, x + s * 0.5, y + s * 0.6, x + s * 0.5, y + s * 0.3);
  ctx.bezierCurveTo(x + s * 0.5, y, x, y, x, y + s * 0.3); ctx.closePath();
}
function starPath(x, y, r, rot = 0, pts = 5, inner = 0.45) {
  ctx.beginPath();
  for (let i = 0; i < pts * 2; i++) { const a = rot + i * Math.PI / pts - Math.PI / 2, rr = i % 2 ? r * inner : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  ctx.closePath();
}
function txt(s, x, y, size, fill = '#fff', stroke = OUT, align = 'center', lw) {
  ctx.font = `bold ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  if (stroke) { ctx.lineWidth = lw || Math.max(3, size * 0.2); ctx.strokeStyle = stroke; ctx.strokeText(s, x, y); }
  ctx.fillStyle = fill; ctx.fillText(s, x, y);
}

// ----------------------------------------------------------- background
function drawCloud(x, y, s, face) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = '#cfe9ff';
  for (const [cx, cy, r] of [[-40, 10, 26], [0, 12, 30], [40, 10, 24]]) { ctx.beginPath(); ctx.arc(cx, cy + 5, r, 0, 7); ctx.fill(); }
  ctx.fillStyle = '#fff';

  txt(fmtTime(playTime), W - 71, 33, 24, '#fff', OUT);
  if (boss && boss.active && !boss.dead) {
    const bw = 340, bx = W / 2 - bw / 2, by = 70;
    pill(bx - 16, by - 34, bw + 32, 70);
    txt('BIG BUG BOSS', W / 2, by - 14, 20, '#ffd23f', OUT);
    ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.beginPath(); ctx.roundRect(bx, by, bw, 18, 9); ctx.fill();
    ctx.fillStyle = '#ff4d6d'; ctx.beginPath(); ctx.roundRect(bx, by, bw * Math.max(0, boss.hp) / EDEF.boss.hp, 18, 9); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.roundRect(bx, by, bw, 18, 9); ctx.stroke();
  }
  if (muted) txt('🔇 muted (M)', W - 80, 72, 14, '#fff', OUT);
}
const fmtTime = t => Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0');

function rainbowTitle(s, x, y, size, t) {
  ctx.font = `bold ${size}px ${FONT}`;
  const cols = ['#ff4d6d', '#ff9a1f', '#ffd23f', '#5fdc4b', '#3fd0ff', '#8d6bff'];
  let w = 0; const ws = [...s].map(c => { const m = ctx.measureText(c).width; w += m; return m; });
  let cx = x - w / 2;
  [...s].forEach((c, i) => {
    const bob = Math.sin(t * 4 + i * 0.5) * size * 0.08;
    txt(c, cx + ws[i] / 2, y + bob, size, c === ' ' ? '#fff' : cols[i % cols.length], OUT, 'center', size * 0.22);
    cx += ws[i];
  });
}
function drawTitle() {
  ctx.fillStyle = 'rgba(20,10,50,.35)'; ctx.fillRect(0, 0, W, H);
  rainbowTitle('HAMMER DUCK', W / 2, 112, 92, titleT);
  txt('~ Bug Island Rescue ~', W / 2, 186, 30, '#fff', OUT);
  // big duck
  const cyc = titleT % 2.2, ham = cyc < 0.3 ? swingAngle(cyc) : REST + Math.sin(titleT * 3) * 0.05;
  drawDuck({ x: 250, y: 420, face: 1, scale: 2.6, body: '#ffd23f', light: '#fff0a6', dark: '#f0b400', acc: 'bandana', ham, determined: true, sy: 1 + Math.sin(titleT * 4) * 0.02 });
  if (cyc > 0.14 && cyc < 0.2) shake = Math.max(shake, 5);
  const scared = cyc > 0.15 && cyc < 1.0;
  ctx.save(); ctx.translate(0, scared ? -Math.sin((cyc - 0.15) / 0.85 * Math.PI) * 30 : 0);
  drawBug({ type: 'beetle', x: 440, y: 390, w: 52, h: 39, dir: -1, t: titleT, dead: false, inv: scared ? 0.05 : 0 });
  ctx.restore();
  drawBug({ type: 'fly', x: 500, y: 300 + Math.sin(titleT * 3) * 12, w: 36, h: 30, dir: -1, t: titleT, dead: false, inv: 0 });
  // story
  ctx.fillStyle = 'rgba(255,255,255,.92)'; ctx.strokeStyle = OUT; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.roundRect(560, 222, 420, 262, 22); ctx.fill(); ctx.stroke();
  const lines = ['Bugs are invading Duck Island!', 'Grab your mighty hammer, smash', 'every bug, and get home to your', 'duckling family!'];
  lines.forEach((l, i) => txt(l, 770, 248 + i * 24, 18, '#3b2410', null));
  const ctl = [['← →', 'walk'], ['SPACE', 'jump'], ['H', 'hammer'], ['G', 'THROW hammer!'], ['J / ↓ in air', 'slam!'], ['↓', 'duck']];
  ctl.forEach(([k, v], i) => { txt(k, 755, 354 + i * 21, 16, '#e8262e', null, 'right'); txt(v, 775, 354 + i * 21, 16, '#3b2410', null, 'left'); });
  if (Math.floor(titleT * 2) % 2 === 0) txt('Press ENTER or SPACE to start', W / 2, 520, 30, '#ffd23f', OUT);
  txt('F = full screen   ·   M = mute   ·   P = pause   ·   gamepad works too', W / 2, 557, 14, '#fff', OUT);
}
function drawWin() {
  if (winT < 1.6) return;
  const t = winT - 1.6, s = t < 0.4 ? easeOut(t / 0.4) : 1;
  ctx.save(); ctx.translate(W / 2, 120); ctx.scale(s, s);
  rainbowTitle('ISLAND SAVED!', 0, 0, 78, gT);
  ctx.restore();
  if (t > 0.5) {
    const a = Math.min(1, (t - 0.5) * 3);
    ctx.globalAlpha = a;
    txt('The duckling family is safe and sound!', W / 2, 186, 26, '#fff', OUT);
    ctx.fillStyle = 'rgba(30,20,60,.55)'; ctx.beginPath(); ctx.roundRect(W / 2 - 200, 212, 400, 112, 20); ctx.fill();
    txt('Bugs smashed:  ' + stats.bugs + '  + the Big Bug', W / 2, 238, 20, '#fff', OUT);
    txt('Sunseeds:  ' + stats.seeds + ' / ' + L.totalSeeds, W / 2, 266, 20, '#ffd23f', OUT);
    txt('Time:  ' + fmtTime(playTime), W / 2, 294, 20, '#9fe7ff', OUT);
    ctx.globalAlpha = 1;
  }
  if (t > 1.2 && allSeeds()) txt('☀ ALL ' + L.totalSeeds + ' SUNSEEDS!  The sun is laughing with joy! ☀', W / 2, 346, 22, '#fff27a', '#c25a00');
  if (winT > 3 && Math.floor(gT * 2) % 2 === 0) txt('Press ENTER to play again', W / 2, allSeeds() ? 386 : 352, 26, '#ffd23f', OUT);
}

function render() {
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  const sx = (Math.random() - .5) * shake, sy = (Math.random() - .5) * shake;
  const cx = Math.round(camX + sx), cy = Math.round(camY + sy);
  drawBackground(cx, cy);
  ctx.save(); ctx.translate(-cx, -cy);
  drawWater(cx, cy);
  for (const d of L.decor) {
    if (d.x < cx - 140 || d.x > cx + W + 140) continue;
    if (d.type === 'palm') drawPalm(d); else if (d.type === 'bush') drawBush(d); else if (d.type === 'flower') drawFlower(d); else drawShell(d);
  }
  for (const s of L.signs) if (Math.abs(s.x - cx - W / 2) < W) drawSign(s);
  for (const c of L.cps) if (Math.abs(c.x - cx - W / 2) < W) drawCheckpoint(c);
  drawTiles(cx);
  for (const s of L.springs) drawSpring(s);
  for (const m of L.movers) drawMover(m);
  drawFamily();
  for (const it of L.items) if (Math.abs(it.x - cx - W / 2) < W) drawItem(it);
  for (const e of L.enemies) if (Math.abs(e.x - cx - W / 2) < W) drawBug(e);
  if (state !== 'title') drawPlayer();
  drawThrown();
  drawParts();
  drawPops();
  ctx.restore();
  if (state === 'title') { drawTitle(); return; }
  if (sunJoy > 0.01) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(925, 150, 60, 925, 150, 1000);
    g.addColorStop(0, 'rgba(255,220,120,' + (0.16 * sunJoy) + ')'); g.addColorStop(1, 'rgba(255,200,100,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.restore();
  }
  drawHUD();
  if (state === 'win') drawWin();
  if (state === 'gameover') {
    ctx.fillStyle = 'rgba(20,10,50,' + Math.min(0.6, goT) + ')'; ctx.fillRect(0, 0, W, H);
    const s = goT < 0.4 ? easeOut(goT / 0.4) : 1;
    ctx.save(); ctx.translate(W / 2, H / 2 - 60); ctx.scale(s, s); txt('GAME OVER', 0, 0, 84, '#ff4d6d', OUT); ctx.restore();
    if (goT > 0.6) txt('The bugs won this time... but the ducklings still need you!', W / 2, H / 2 + 10, 22, '#fff', OUT);
    if (goT > 1 && Math.floor(gT * 2) % 2 === 0) txt('Press ENTER to start again', W / 2, H / 2 + 70, 30, '#ffd23f', OUT);
  }
  if (state === 'pause') {
    ctx.fillStyle = 'rgba(20,10,50,.5)'; ctx.fillRect(0, 0, W, H);
    txt('PAUSED', W / 2, H / 2 - 20, 70, '#ffd23f', OUT);
    txt('Press P or ENTER to continue', W / 2, H / 2 + 40, 24, '#fff', OUT);
    txt('F = full screen   ·   M = mute', W / 2, H / 2 + 80, 18, '#fff', OUT);
  }
}

// ---------------------------------------------------------------- main loop
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  pollPad();
  if (state === 'play' || state === 'win') {
    acc += dt;
    while (acc >= STEP_DT) { step(STEP_DT); acc -= STEP_DT; }
  } else {
    acc = 0; gT += dt;
    if (state === 'gameover') { goT += dt; updateFx(dt); }
    if (state === 'title') { titleT += dt; updateMovers(dt); updateFx(dt); shake = Math.max(0, shake - dt * 40); }
  }
  music();
  render();
  requestAnimationFrame(frame);
}
resetGame();
// debug: index.html#x=120 starts at column 120, #win jumps to the ending
(function () {
  const m = location.hash.match(/x=(\d+)/);
  if (m || location.hash === '#win') {
    state = 'play';
    const col = m ? +m[1] : GOAL_COL - 2;
    if (!m) { boss.dead = true; boss.active = false; for (let y = 0; y < ROWS; y++) { setT(ARENA_L, y, 0); setT(ARENA_R, y, 0); } keys.ArrowRight = true; }
    P.x = col * TS; P.y = groundTop(col) - P.h; camX = clamp(P.x - W * 0.4, 0, LW * TS - W);
  }
})();
requestAnimationFrame(frame);
</script>
</body>
</html>

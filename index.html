<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Hammer Duck</title>
<meta name="theme-color" content="#1b1530">
<!-- "Add to Home Screen" opens the game full screen, like an app (the only way to get full screen on iPhone) -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hammer Duck">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
  html,body{margin:0;height:100%;background:#1b1530;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;
    touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  canvas{display:block;border-radius:14px;box-shadow:0 12px 50px rgba(0,0,0,.55);cursor:pointer}
  #tc{position:fixed;left:0;top:0;pointer-events:none;border-radius:0;box-shadow:none}
  #safe{position:fixed;visibility:hidden;pointer-events:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  @media (hover:none) and (pointer:coarse){canvas{border-radius:0;box-shadow:none}}
  body.touch{align-items:flex-start}
  :fullscreen canvas{border-radius:0;box-shadow:none;cursor:none}
  :fullscreen body,:fullscreen{background:#000}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="tc"></canvas>
<div id="safe"></div>
<script src="src/engine.js"></script>
<script src="worlds/island.js"></script>
<script src="worlds/frost.js"></script>
<script src="src/story.js"></script>
<script src="src/touch.js"></script>
<script src="src/main.js"></script>
</body>
</html>
